<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bewerbung bestätigen · PaMe</title>
  <style>
    :root{
      --bg:#0d0a14; --card:#191326; --card2:#211a30; --line:#2d2440;
      --text:#f0eaf4; --muted:#a79cb8; --blue:#c724b1; --orange:#f2d500; --good:#28c76f; --bad:#ff5d6c;
    }
    *{box-sizing:border-box}
    body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
      background:radial-gradient(900px 500px at 50% 0%, rgba(199,36,177,.18), transparent 70%), var(--bg);
      color:var(--text); font-family:"Segoe UI",system-ui,-apple-system,sans-serif; line-height:1.55; text-align:center}
    .box{max-width:460px; width:100%}
    .logo-img{height:120px; width:auto; max-width:60%; margin:0 auto 26px; display:block;
      filter:drop-shadow(0 10px 28px rgba(201,36,177,.4))}
    .icon{width:92px; height:92px; margin:0 auto 20px; border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:52px}
    .icon.ok{background:var(--good); color:#06240f; box-shadow:0 12px 40px rgba(40,199,111,.4)}
    .icon.wait{background:var(--card2); color:var(--orange); border:1px solid var(--line)}
    .icon.err{background:var(--bad); color:#3a0109; box-shadow:0 12px 40px rgba(255,93,108,.35)}
    h1{font-size:23px; margin:0 0 10px}
    p{color:var(--muted); font-size:15px; margin:0 0 8px}
    .appid{margin:20px auto 0; max-width:360px; background:var(--card2); border:1px solid var(--line);
      border-left:4px solid var(--orange); border-radius:14px; padding:14px 16px; text-align:left}
    .appid span{display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
    .appid b{font-size:26px; letter-spacing:.04em; color:var(--orange); font-family:ui-monospace,Consolas,monospace; margin:0}
    .appid .coderow{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:5px}
    .id-copy{display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:1px solid var(--line);
      background:var(--card); color:var(--text); font-size:13px; font-weight:600; padding:8px 13px; border-radius:10px;
      font-family:inherit; transition:background .18s, border-color .18s, color .18s, transform .06s}
    .id-copy:hover{border-color:var(--orange)}
    .id-copy:active{transform:scale(.95)}
    .id-copy.copied{background:var(--good); border-color:var(--good); color:#06240f; animation:cp-pop .42s ease}
    @keyframes cp-pop{0%{transform:scale(1)} 40%{transform:scale(1.14)} 100%{transform:scale(1)}}
    .retry{margin-top:18px; padding:12px 18px; border:none; border-radius:11px; cursor:pointer;
      background:var(--blue); color:#fff; font-size:15px; font-weight:700; font-family:inherit}
    .retry:hover{filter:brightness(1.1)}
    .home{display:inline-block; margin-top:18px; color:#efc4e8; text-decoration:none; border:1px solid var(--line);
      padding:7px 16px; border-radius:999px; font-weight:600; font-size:14px}
    .home:hover{border-color:var(--blue); color:#fff}
  </style>
</head>
<body>
  <div class="box">
    <img class="logo-img" src="pame-logo.png" alt="PaMe">
    <div class="icon wait" id="icon">⏳</div>
    <h1 id="title">Bewerbung wird bestätigt …</h1>
    <p id="msg">Einen Moment bitte.</p>
    <div id="extra"></div>
  </div>

  <script>
    const POINTER = 'https://raw.githubusercontent.com/MaxiGallaxy/pame-bewerbung/main/backend.json';
    const icon = document.getElementById('icon');
    const title = document.getElementById('title');
    const msg = document.getElementById('msg');
    const extra = document.getElementById('extra');

    function token() {
      const u = new URL(window.location.href);
      return u.searchParams.get('t') || u.searchParams.get('token') || '';
    }
    function show(state, t, m, html) {
      icon.className = 'icon ' + state;
      icon.textContent = state === 'ok' ? '✓' : (state === 'err' ? '✕' : '⏳');
      title.textContent = t; msg.innerHTML = m; extra.innerHTML = html || '';
    }

    async function backendUrl() {
      try {
        const r = await fetch(POINTER + '?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return '';
        const j = await r.json();
        return (j && j.online && j.url) ? j.url.replace(/\/+$/, '') : '';
      } catch (e) { return ''; }
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    function showSuccess(j) {
      const idBox = j.code
        ? '<div class="appid"><span>Deine Bewerber-ID</span><div class="coderow">'
          + '<b>' + j.code + '</b>'
          + '<button type="button" class="id-copy" id="vIdCopy" aria-label="Bewerber-ID kopieren"><span class="ic">📋</span><span class="tx">Kopieren</span></button>'
          + '</div></div>'
        : '';
      if (j.status === 'already') {
        show('ok', 'Schon bestätigt ✅', 'Deine Bewerbung war bereits bestätigt – es ist alles erledigt. Flashi meldet sich bei dir.', idBox);
      } else {
        show('ok', 'Bewerbung erfolgreich zugestellt! 🎉',
          'Deine Bewerbung ist jetzt endgültig bei Flashi eingegangen. Wir melden uns per E-Mail bei dir – schau ggf. auch in den Spam-Ordner.', idBox);
      }
      if (j.code) wireCopy(j.code);
    }

    // Bewerber-ID in die Zwischenablage kopieren (mit Fallback für unsichere Kontexte).
    function wireCopy(code) {
      const btn = document.getElementById('vIdCopy');
      if (!btn) return;
      const ic = btn.querySelector('.ic'), tx = btn.querySelector('.tx');
      let resetT = null;
      async function doCopy(t) {
        try { await navigator.clipboard.writeText(t); return true; }
        catch (e) {
          try {
            const ta = document.createElement('textarea');
            ta.value = t; ta.setAttribute('readonly', '');
            ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.focus(); ta.select();
            const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
          } catch (e2) { return false; }
        }
      }
      btn.addEventListener('click', async () => {
        const ok = await doCopy(code);
        clearTimeout(resetT);
        if (ok) {
          btn.classList.remove('copied'); void btn.offsetWidth;
          btn.classList.add('copied'); ic.textContent = '✓'; tx.textContent = 'Kopiert!';
          resetT = setTimeout(() => { btn.classList.remove('copied'); ic.textContent = '📋'; tx.textContent = 'Kopieren'; }, 1700);
        } else {
          tx.textContent = 'Bitte manuell kopieren';
          resetT = setTimeout(() => { tx.textContent = 'Kopieren'; }, 2000);
        }
      });
    }

    async function run() {
      const t = token();
      if (!t) { show('err', 'Link unvollständig', 'Dieser Bestätigungslink ist ungültig. Bitte nutze den Link aus deiner Bestätigungsmail.'); return; }
      show('wait', 'Bewerbung wird bestätigt …', 'Einen Moment bitte.');
      // Mehrere Versuche (selbstheilend): Der Zeiger (aktuelle Tunnel-Adresse) kann
      // nach einem Neustart kurz veraltet sein, und eine einzelne Tunnel-Verbindung
      // kann mal zucken. Ging eine Erfolgsantwort verloren, liefert der nächste
      // Versuch „already" = ebenfalls Erfolg. Vor jedem Versuch den Zeiger neu lesen.
      let wasOffline = false;
      for (let i = 0; i < 3; i++) {
        const base = await backendUrl();
        if (!base) { wasOffline = true; await sleep(1500); continue; }
        wasOffline = false;
        try {
          const r = await fetch(base + '/api/pame/verify', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: t })
          });
          const j = await r.json().catch(() => ({}));
          if (r.ok) { showSuccess(j); return; }
          // Server hat geantwortet und abgelehnt (z. B. ungültiges Token) – kein Retry.
          show('err', 'Bestätigung fehlgeschlagen',
            (typeof j.detail === 'string' ? j.detail : 'Bestätigung konnte nicht abgeschlossen werden.') +
            ' <b>Dein Link bleibt gültig</b> – du kannst es später erneut versuchen.',
            '<button class="retry" onclick="run()">Erneut versuchen</button>');
          return;
        } catch (e) { await sleep(1500); }
      }
      show('err', wasOffline ? 'Gerade nicht erreichbar' : 'Verbindung hat nicht geklappt',
        (wasOffline
          ? 'Der Bewerbungs-Eingang ist im Moment offline. '
          : 'Die Verbindung hat gerade nicht geklappt. ') +
        '<b>Dein Link bleibt gültig</b> – bitte versuche es gleich noch einmal.',
        '<button class="retry" onclick="run()">Erneut versuchen</button>');
    }
    window.run = run;
    run();
  </script>
</body>
</html>
